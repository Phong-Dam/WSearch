<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSearch - Fast File Search</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-zinc-900 text-zinc-200 text-sm font-mono">

    <!-- ============================================
         LOADING SCREEN
         ============================================ -->
    <div id="loadingScreen" class="fixed inset-0 bg-zinc-900 flex flex-col items-center justify-center">
        <div class="spinner mb-6"></div>
        <div class="text-2xl font-bold text-yellow-400 mb-2" id="loadingText">Đang tải...</div>
        <div class="text-lg text-zinc-400" id="loadingCount"></div>
    </div>

    <!-- ============================================
         MAIN CONTENT
         ============================================ -->
    <div id="mainContent" class="hidden">
        
        <!-- Search Bar -->
        <div class="p-3 border-b border-zinc-700">
            <input 
                id="search"
                class="w-full bg-zinc-800 p-2 rounded outline-none text-lg"
                placeholder="Search files..."
                autocomplete="off"
                autofocus>
            
            <div class="mt-2 flex items-center">
                <label class="flex items-center cursor-pointer text-xs text-zinc-400 hover:text-zinc-200">
                    <input 
                        type="checkbox" 
                        id="useFuzzy" 
                        class="mr-2 w-4 h-4" 
                        checked>
                    <span>Fuzzy Search</span>
                </label>
            </div>
        </div>

        <!-- Column Headers -->
        <div id="header" class="row border-b border-zinc-700 text-zinc-400 font-bold bg-zinc-900">
            <div class="column-header"></div>
            
            <div class="column-header hover:bg-zinc-800 group">
                <span class="cursor-pointer flex-1" data-sort="name">Name</span>
                <div class="resizer" id="resizer-name"></div>
            </div>

            <div class="column-header hover:bg-zinc-800 group">
                <span class="cursor-pointer flex-1" data-sort="size">Size</span>
                <div class="resizer" id="resizer-size"></div>
            </div>

            <div class="column-header hover:bg-zinc-800 group">
                <span class="cursor-pointer flex-1" data-sort="path">Path</span>
            </div>
        </div>

        <!-- Context Menu -->
        <div id="contextMenu">
            <div id="ctxOpen">Open File</div>
            <div id="ctxShowFolder">Show in Folder</div>
            <div id="ctxCopyPath">Copy Path</div>
            <div id="ctxCopyName">Copy Name</div>
        </div>

        <!-- Results List -->
        <div id="results"></div>

        <!-- Empty State (hidden by default) -->
        <div id="emptyState" class="hidden">
            <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <div class="empty-state-text">No results found</div>
                <div class="empty-state-hint">Try a different search term</div>
            </div>
        </div>
    </div>
    <!-- END MAIN CONTENT -->

    <!-- Application Script -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
